
<div class="entete">
    <h2 class="users">Liste des categories</h2>
    <button mat-flat-button color="primary" id="btn-add" (click)="openDialog()">Ajouter</button>
  </div>
  
  <mat-card class="cardWithShadow">
      <mat-card-content>
    
        <div class="table-responsive">
          <table mat-table [dataSource]="dataSource" class="w-100">
          
         
  
            
  
            <ng-container matColumnDef="nomCategorie">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Nom
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.nomCategorie }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="description">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Description
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.description }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="image">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Image
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.image }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="dateCreation">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Date Creation
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.dateCreation }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            
  
            <ng-container matColumnDef="dateModif">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Date de modification
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.dateModif != null ? element.dateModif : "Pas modifier" }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
    
            
    
            <!-- Symbol Column -->
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openDialog()">
                    <mat-icon>add</mat-icon>
                    <span>Ajouter</span>
                  </button>
                  <button mat-menu-item (click)="editElement(element)">
                    <mat-icon>edit</mat-icon>
                    <span>Modifier</span>
                  </button>
                  <button mat-menu-item (click)="onDelete(element)">
                    <mat-icon>delete</mat-icon>
                    <span>Supprimer</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>
                  <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" align="center" >Aucune donnée trouvé </td>
        </tr>
    
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 20, 30, 50,  60, 70, 80, 90 , 100]"
          showFirstLastButtons
          aria-label="Select page of periodic elements">
          </mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
