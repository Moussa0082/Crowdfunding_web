<mat-card-content class="p-32">
  <form class="m-t-30" [formGroup]="categorieForm">
    <div class="entete">
      <h2>{{ isEditMode ? 'Modifier categorie' : 'Ajouter categorie' }}</h2>
    </div>

    <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Nom</mat-label>
    <mat-form-field appearance="outline" class="w-100" color="primary">
      <input matInput   formControlName="nomCategorie" />
    </mat-form-field>

    <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Description</mat-label>
    <mat-form-field appearance="outline" class="w-100" color="primary">
      <!-- <input matInput type="text" rows="5" formControlName="description"/> -->
      <textarea matInput rows="5" formControlName="description"></textarea>
    </mat-form-field>

    <!-- Buttons row -->
    <div class="d-flex gap-16 m-t-20">
      <button mat-flat-button color="warn" class="flex-1" (click)="onNoClick()" type="button">
        Annuler
      </button>
      <button mat-flat-button (click)="onSaves()" color="primary" class="flex-1">
        {{ isEditMode ? 'Modifier' : 'Ajouter' }}
      </button>
    </div>
  </form>
</mat-card-content>
