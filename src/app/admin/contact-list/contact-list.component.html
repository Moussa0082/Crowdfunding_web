
<div class="entete" style="margin: 2%;">
    <h2 class="users">Liste des messages de contact</h2>
  </div>
  
  <mat-card class="cardWithShadow">
      <mat-card-content>
    
        <div class="table-responsive">
          <table mat-table [dataSource]="dataSource" class="w-100">
          
           
  
            
  
            <ng-container matColumnDef="nomComplet">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Nom Complet
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.nomComplet }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Email
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.email }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="numero">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Numéro
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.numero }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="telephone">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Numéro
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.telephone }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="message">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Message
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.message }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            <ng-container matColumnDef="dateAjout">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14 p-l-0">
                Date d'envoi
              </th>
              <td mat-cell *matCellDef="let element" class="p-l-0">
                <div class="d-flex align-items-center">
                  
                  <div class="m-l-16">
                    <h6 class="f-s-14 f-w-600">
                      {{ element.dateAjout }}
                    </h6>
                  </div>
                </div>
              </td>
            </ng-container>
  
            
    
            
    
            <!-- Symbol Column -->
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
              <td mat-cell *matCellDef="let element">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  
                  <button mat-menu-item (click)="onDelete(element)">
                    <mat-icon>delete</mat-icon>
                    <span>Supprimer</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>
                  <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" align="center" >Aucune donnée trouvé </td>
        </tr>
    
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
          <mat-paginator [pageSizeOptions]="[5, 10, 20, 30, 50,  60, 70, 80, 90 , 100]"
          showFirstLastButtons
          aria-label="Select page of periodic elements">
          </mat-paginator>
        </div>
      </mat-card-content>
    </mat-card>
