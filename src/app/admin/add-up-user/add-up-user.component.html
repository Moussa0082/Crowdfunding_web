
<mat-card-content class="p-32">

<h2 mat-dialog-title>{{ isEditMode ? 'Modifier un utilisateur' : 'Ajouter un utilisateur' }}</h2>

  <form class="m-t-30" [formGroup]="userForm"> 
       <mat-form-field appearance="outline" class="w-100" color="primary">
         <mat-label >Nom Structure</mat-label>
        <input matInput formControlName="nonStructure" >
        <!-- <mat-error *ngIf="userForm.controls['nonStructure'].hasError('required') && userForm.controls['nonStructure'].touched">
          Le nom de la structure est requis.
        </mat-error> -->
      </mat-form-field>

    <div class="form-row">
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom" >
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" required>
      
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Téléphone</mat-label>
        <input matInput formControlName="numero" required>
       
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Adresse</mat-label>
        <input matInput formControlName="addresse" required>
   
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="w-100" color="primary">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" required type="email">
         <!-- <mat-error *ngIf="userForm.controls['email'].hasError('required') && userForm.controls['email'].touched">
          L'email est requis.
        </mat-error> -->
        <mat-error *ngIf="userForm.controls['email'].hasError('email') && userForm.controls['email'].touched">
          Format d'email invalide.
        </mat-error>
      </mat-form-field>

      <mat-form-field  *ngIf="!isEditMode" appearance="outline" class="w-100" color="primary">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
        <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Afficher / Cacher le mot de passe'" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="userForm.controls['password'].hasError('required') && userForm.controls['password'].touched">
          Le mot de passe est requis.
        </mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" class="w-100" color="primary" > <mat-label>Rôle utilisateur</mat-label>
        <mat-select formControlName="roleUtilisateur" required>
          <mat-option value="ADMIN">Admin</mat-option>
          <mat-option value="USER">Utilisateur</mat-option>
        </mat-select>
        <!-- <mat-error *ngIf="userForm.controls['roleUtilisateur'].hasError('required') && userForm.controls['roleUtilisateur'].touched">
          Le rôle utilisateur est requis.
        </mat-error> -->
      </mat-form-field>

      <!-- <mat-form-field appearance="fill">
        <mat-label>Rôle</mat-label>
        <mat-select formControlName="roleUtilisateur" required>
          <mat-option value="admin">Admin</mat-option>
          <mat-option value="user">Utilisateur</mat-option>       
        </mat-select>
        <mat-error *ngIf="userForm.controls['roleUtilisateur'].hasError('required') && userForm.controls['roleUtilisateur'].touched">
          Le rôle utilisateur est requis.
        </mat-error>
      </mat-form-field> -->

      </div>

    <div class="form-row image-upload-section">
      <input type="file" id="file-upload" (change)="onFileChange($event)" style="display: none;" accept="image/*">
      <label for="file-upload" class="mat-raised-button mat-primary file-upload-button"> <mat-icon>cloud_upload</mat-icon>
        <span>Charger une image</span>
      </label>
      <mat-card *ngIf="imagePreview" class="image-preview-card">
        <img [src]="imagePreview" class="image-preview" alt="Image Preview">
      </mat-card>
    </div>

    <div class="d-flex gap-16 m-t-20">
      <button mat-flat-button color="warn" class="flex-1" (click)="onNoClick()" type="button">
        Annuler
      </button>
      <button mat-flat-button (click)="onSaves()" color="primary" class="flex-1">
        {{ isEditMode ? 'Modifier' : 'Ajouter' }}
      </button>
    </div>

  </form>


</mat-card-content>
